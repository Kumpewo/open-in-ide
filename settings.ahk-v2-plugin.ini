[Deploy]
Destination=C:\bin
;Destination=%A_MyDocuments%\AutoHotkey\Lib
;Message=Deploy OpenInIDE to %DESTINATION%
;GenerateOverview=no
;Banner=Installed copy of {source-relative}, do not modify.`nEdit the source in project {project-name} and deploy.
;Banner=@standard
;Banner=find:banner.txt
RequiresAdmin=yes
;Compile=no
;EmbedOrigin=no

[Install]
OpenInIDE.exe=.
;pictures\*.png=pictures

[InstallIfMissing]

[AddBanner]
;*.ahk=no
;test\=no
;*.cmd=yes
;readme.txt=line:#

[Cleanup]
;*.tmp=%A_Temp%\OpenInIDE\

[SetVersion]
;*.cmd=yes
scratch\=no
test\=no
;version.txt=line:#
